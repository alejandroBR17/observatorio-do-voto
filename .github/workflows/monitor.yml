name: Acompanhar fontes eleitorais
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor-election
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Consultar apuração, institutos e imprensa
        env:
          SITE: https://observatorio-voto.vercel.app
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const sources = await Promise.all(['live', 'polls', 'media'].map(async (endpoint) => {
            try {
              const response = await fetch(`${process.env.SITE}/api/${endpoint}`, {
                signal: AbortSignal.timeout(55000),
              });
              const data = await response.json();
              const accepted = endpoint === 'live' ? ['waiting', 'live'] : endpoint === 'polls' ? ['ready'] : ['live'];
              const age = Date.now() - Date.parse(data.checkedAt || '');
              return {
                endpoint, status: data.status || 'unavailable', checkedAt: data.checkedAt || null,
                ok: response.ok && accepted.includes(data.status) && !data.stale && data.cacheStorage !== 'temporary' && age >= -300000 && age < 600000,
              };
            } catch {
              return { endpoint, status: 'unavailable', checkedAt: null, ok: false };
            }
          }));
          console.log(JSON.stringify(sources, null, 2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Consulta: ${new Date().toISOString()}\n\n| Fonte | Estado | Consultada em | Saudável |\n| --- | --- | --- | --- |\n` +
            sources.map(s => `| ${s.endpoint} | ${s.status} | ${s.checkedAt || '—'} | ${s.ok ? 'Sim' : 'Não'} |`).join('\n') + '\n');
          if (sources.some(source => !source.ok)) process.exitCode = 1;
          JS
