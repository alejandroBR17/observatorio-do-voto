name: Acompanhar fontes eleitorais
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor-election
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Consultar apuração, institutos e imprensa
        env:
          SITE: https://observatorio-voto.vercel.app
        run: |
          for endpoint in live polls media; do
            curl --fail --silent --show-error --max-time 65 --retry 2 --retry-delay 3 "$SITE/api/$endpoint" > "$endpoint.json"
            node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1])); if(!d.status || ["unavailable","stale"].includes(d.status))process.exit(1); console.log(process.argv[1],d.status,d.checkedAt);' "$endpoint.json"
          done
